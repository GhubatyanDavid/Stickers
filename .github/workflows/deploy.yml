name: Deploy SoundSticker

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/Stickers/SoundSticker
            git pull
            dotnet publish -c Release -o publish
            systemctl restart soundsticker
            systemctl status soundsticker --no-pager